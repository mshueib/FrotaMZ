<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrotaMZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-mark" aria-hidden="true">FM</div><div><b>FrotaMZ</b><small>Gestão de frota</small></div></div>
    <nav class="nav" id="nav" aria-label="Módulos"></nav>
    <div class="side-foot" id="sideUser"></div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="h1">Painel</h1><p id="hsub"></p></div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div id="demoNote"></div>
    <div id="view"></div>
  </main>
</div>
<div id="drawer" class="drawer" hidden>
  <div class="drawer-bg" data-close></div>
  <div class="drawer-p" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="drawer-h"><h3 id="dTitle"></h3><button class="btn ghost sm" data-close aria-label="Fechar">✕</button></div>
    <form id="dForm" novalidate style="display:contents">
      <div class="drawer-b" id="dBody"></div>
      <div class="drawer-f" id="dFoot"></div>
    </form>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="busca" class="busca" hidden>
  <div class="busca-bg" data-bclose></div>
  <div class="busca-p" role="dialog" aria-modal="true" aria-label="Pesquisar">
    <input id="bq" type="search" placeholder="Matrícula, cliente, motorista, nº de requisição ou fatura…" autocomplete="off" aria-label="Pesquisar" aria-controls="bres">
    <ul id="bres" role="listbox"></ul>
    <div class="busca-f"><span>↑ ↓ navegar</span><span>Enter abrir</span><span>Esc fechar</span></div>
  </div>
</div>
<div id="print" aria-hidden="true"></div>
<script src="js/sample-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
